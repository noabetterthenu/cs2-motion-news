name: Update CS2 Matches

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch CS2 matches
        env:
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
        run: python scripts/fetch_matches.py

      - name: Save matches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/matches.json
          git commit -m "Update CS2 matches" || true

      - name: Push matches
        run: git push
