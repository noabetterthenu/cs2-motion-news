name: Update CS2 News

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch HLTV news
        run: python scripts/fetch_news.py

      - name: Save news
        run: git add public/news.json && git commit -m "Update HLTV news" || true
      
      - name: Push news
        run: git push


      

